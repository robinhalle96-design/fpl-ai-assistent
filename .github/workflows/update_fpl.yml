name: Update FPL Predictions

on:
  schedule:
    # Körs automatiskt varje natt kl 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch: # Gör att du även kan starta körningen manuellt via GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run FPL AI Script
      run: python fpl_ai.py

    - name: Commit and push updated data
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add fpl_predictions.csv top_players.md
        git commit -m "Auto-update FPL predictions" || exit 0
        git push

