name: Update FPL Predictions

on:
  schedule:
    - cron: '0 3 * * *' # Körs varje natt kl 03:00
  workflow_dispatch: # Gör så att du kan köra den manuellt

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run prediction script
        run: python fpl_ai.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md fpl_predictions.csv
          git diff --staged --quiet || (git commit -m "Auto-update FPL team and predictions" && git push)

